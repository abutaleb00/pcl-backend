services:
  app:
    image: pcl-backend:latest
    build: .
    container_name: pcl-backend
    ports:
      - "5001:5000"
    volumes:
      # Host path (./uploads) : Container path (/usr/src/app/uploads)
      - ./uploads:/usr/src/app/uploads
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    restart: unless-stopped